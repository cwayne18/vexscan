name: scan

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Source repo to scan (govulncheck source mode), e.g. github.com/rancher/rancher. Mutually exclusive with image."
        required: false
        type: string
      image:
        description: "Container image to scan (pclntab/OSV mode), e.g. wlambert/velociraptor:latest. Mutually exclusive with repo."
        required: false
        type: string
      package:
        description: "Package(s) to check, comma-separated: 'golang:golang.org/x/net', 'golang:stdlib', 'deb:openssl'. Leave empty to use cves or all."
        required: false
        type: string
      cves:
        description: "CVE/GHSA/GO ids, comma-separated. On their own, they are resolved against the whole target."
        required: false
        type: string
      all:
        description: "Check everything each ecosystem can enumerate (cannot be combined with package)"
        required: false
        type: boolean
        default: false
      ecosystem:
        description: "Restrict to these ecosystems, comma-separated: golang, os. Empty runs all of them."
        required: false
        type: string
      ref:
        description: "Optional branch, tag, or commit to check out for repo mode"
        required: false
        type: string
      pre_build:
        description: "Optional shell command run in the cloned repo before scanning (repo mode), e.g. 'make config' or 'go generate ./...' for repos that need codegen"
        required: false
        type: string
      llm:
        description: "Run the LLM exploitability check (--llm)"
        required: false
        type: boolean
        default: false
      runner:
        description: "Runner label. ubuntu-latest is the largest free option for public repos (4 vCPU / 16 GB). The larger options only work if your account/org has GitHub larger runners configured."
        required: false
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-latest-4-cores
          - ubuntu-latest-8-cores
          - ubuntu-latest-16-cores
          - ubuntu-latest-32-cores
          - ubuntu-latest-64-cores

permissions:
  contents: read
  # Lets the built-in GITHUB_TOKEN call GitHub Models for --llm.
  models: read

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Validate inputs
        env:
          REPO: ${{ inputs.repo }}
          IMAGE: ${{ inputs.image }}
        run: |
          if [ -n "$REPO" ] && [ -n "$IMAGE" ]; then
            echo "::error::Set either 'repo' or 'image', not both."; exit 1
          fi
          if [ -z "$REPO" ] && [ -z "$IMAGE" ]; then
            echo "::error::You must set one of 'repo' or 'image'."; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install skopeo
        # Image mode extracts the image with skopeo; repo mode does not need it.
        if: ${{ inputs.image != '' }}
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Install cgo build dependencies
        # Source-mode govulncheck compiles the target's packages to build a call
        # graph, so any cgo package needs its C headers/libs present or package
        # loading fails (e.g. libvirt, gpgme, btrfs). Install the common ones;
        # tolerate any that don't resolve so one bad name doesn't fail the job.
        if: ${{ inputs.repo != '' }}
        run: |
          sudo apt-get update
          for p in \
            pkg-config \
            libvirt-dev \
            libgpgme-dev \
            libbtrfs-dev \
            libdevmapper-dev \
            libassuan-dev \
            libseccomp-dev \
            libsystemd-dev \
            libpcap-dev \
            libsqlite3-dev \
            libselinux1-dev \
            liblvm2-dev \
            libudev-dev; do
            sudo apt-get install -y "$p" || echo "::warning::could not install $p"
          done

      - name: Add swap
        # Source-mode govulncheck builds a whole-program call graph and can need
        # well over the runner's RAM on large repos (e.g. rancher/rancher). A big
        # swapfile lets it complete instead of being OOM-killed (signal: killed).
        # The runner ships an active /swapfile, so replace it with a larger one.
        # Only relevant for repo (source) mode.
        if: ${{ inputs.repo != '' }}
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build vexscan
        run: go build -o vexscan .

      - name: Prepare source (pre-build)
        # Some repos don't compile from a clean checkout because they generate
        # code during their build (e.g. warewulf `make config`, velociraptor
        # `make assets`). govulncheck source mode needs the tree to type-check,
        # so when a pre_build command is given we clone the repo ourselves, run
        # it in the checkout, then scan that local path with --repo.
        if: ${{ inputs.repo != '' && inputs.pre_build != '' }}
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          PRE_BUILD: ${{ inputs.pre_build }}
        run: |
          url="$REPO"
          case "$url" in
            http://*|https://*|git@*) ;;
            github.com/*) url="https://$url" ;;
            */*) url="https://github.com/$url" ;;
          esac
          src="$RUNNER_TEMP/scan-src"
          rm -rf "$src"
          git clone --depth 1 ${REF:+--branch "$REF"} "$url" "$src"
          echo "Running pre-build: $PRE_BUILD"
          ( cd "$src" && eval "$PRE_BUILD" )
          echo "SRC_DIR=$src" >> "$GITHUB_ENV"

      - name: Run scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          IMAGE: ${{ inputs.image }}
          PACKAGE: ${{ inputs.package }}
          CVES: ${{ inputs.cves }}
          ALL: ${{ inputs.all }}
          ECOSYSTEM: ${{ inputs.ecosystem }}
          REF: ${{ inputs.ref }}
          LLM: ${{ inputs.llm }}
        run: |
          if [ -n "$IMAGE" ]; then
            args=(--image "$IMAGE")
          elif [ -n "$SRC_DIR" ]; then
            # Pre-built local checkout (scanned in place, no re-clone).
            args=(--repo "$SRC_DIR")
          else
            args=(--repo "$REPO")
            if [ -n "$REF" ]; then
              args+=(--ref "$REF")
            fi
          fi
          # --package/--cves/--ecosystem each take a comma-separated list, so
          # the dispatch inputs pass straight through.
          if [ -n "$PACKAGE" ]; then
            args+=(--package "$PACKAGE")
          fi
          if [ -n "$CVES" ]; then
            args+=(--cves "$CVES")
          fi
          if [ "$ALL" = "true" ]; then
            args+=(--all)
          fi
          if [ -n "$ECOSYSTEM" ]; then
            args+=(--ecosystem "$ECOSYSTEM")
          fi
          if [ "$LLM" = "true" ]; then
            args+=(--llm)
          fi
          echo "Running: vexscan ${args[*]}"
          ./vexscan "${args[@]}"
